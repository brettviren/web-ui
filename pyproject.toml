[project]
name = "web-ui"
version = "0.1.0"
description = "One front door per host for local web UIs: Unix sockets, host-based routing and SSH tunnels"
readme = "README.md"
authors = [{ name = "Brett Viren", email = "brett.viren@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
web-ui = "web_ui.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
