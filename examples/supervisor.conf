# supervisord program for syncthing with its web UI on a Unix socket for web-ui
# (services.syncthing in examples/config.toml).
#
# The socket goes in syncthing's own config dir, which syncthing keeps at mode
# 0700, so only you can reach it.  It is not under $XDG_RUNTIME_DIR, which a
# supervisord started from cron at boot doesn't have, and which is removed when
# your last session ends (unless lingering).  syncthing replaces a stale
# socket left by a crash, and removes it when it exits.
#
# -gui-address only overrides config.xml's <gui><address> while it runs:
# tools that read config.xml (syncthing cli) still look at the old address.

[program:syncthing]
command=/usr/bin/syncthing -no-browser -home=%(ENV_HOME)s/.config/syncthing -gui-address=unix://%(ENV_HOME)s/.config/syncthing/gui.sock
directory=%(ENV_HOME)s
autorestart = True
environment = STNORESTART="1"
