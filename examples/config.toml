# ~/.config/web-ui/config.toml  (everything is optional)

# hostname = "haiku"        # the label for this host in URLs; default: short hostname
# aliases = []              # other labels meaning "this host"
# domain = "localhost"      # browsers resolve *.localhost to loopback by themselves
port = 8484                 # the one loopback TCP port, for browsers at this seat; 0 = none
# runner = "auto"           # systemd (transient user units) | process | auto
# check_uid = true          # refuse connections from other local users
# strict_origin = true      # refuse cross-origin POST/PUT/... and WebSockets
# Services started by systemd or over ssh don't get your login shell's PATH:
bin_dirs = ["~/.local/bin", "~/.local/share/mise/shims", "~/go/bin"]

# ---- services ---------------------------------------------------------------
# command placeholders: {socket} {port} {dir} {instance} {service} {host} {url} {runtime}
# listen = "unix": the service listens on {socket}   (preferred)
# listen = "tcp":  it listens on 127.0.0.1:{port}, a fresh ephemeral port per start

# Verified with agentsview 0.33: TCP only; --public-url makes it trust the proxied origin.
[services.agentsview]
command = ["agentsview", "serve", "--no-browser", "--host", "127.0.0.1", "--port", "{port}", "--public-url", "{url}"]
listen = "tcp"
singleton = true            # one instance, URL agentsview.<host>.localhost
hosts = ["workbox"]         # offered only on these hosts (default: all)
start_timeout = 60          # its first sync can be slow

# maggie (beads web UI) is configured by environment.  Builds with Unix socket
# support (MAGGIE_ADDR=unix:PATH, github.com/brettviren/maggie) listen on the
# instance's private socket.
[services.maggie]
command = ["maggie"]
marker = ".beads"           # `web-ui up maggie` finds the nearest .beads/ upward
env = { MAGGIE_ADDR = "unix:{socket}", MAGGIE_BEADS_DIR = "{dir}" }
# Older builds only speak TCP, by default :8088 on EVERY interface; pin them
# to a private loopback port instead:
# listen = "tcp"
# env = { MAGGIE_ADDR = "127.0.0.1:{port}", MAGGIE_BEADS_DIR = "{dir}" }
# With the systemd runner, confine it to its project (needs unprivileged user namespaces):
# properties = ["ProtectHome=tmpfs", "BindPaths={dir}", "BindReadOnlyPaths=/home/me/.local/bin"]

# wckb's web UI serves the store context of the directory it runs in.  On a
# Unix socket it needs no token and accepts any Host, so no more flags.
[services.wckb]
command = ["kb", "web", "--socket", "{socket}"]
# rewrite_host = true       # for backends that insist on Host: localhost / 127.0.0.1:<port>

# A service started outside web-ui (systemd, by hand): web-ui
# only connects to it, at "unix:PATH" or "HOST:PORT" (~ and $VARS expand on
# each host).  It is a singleton, and `web-ui up/down` won't start or stop it.
# Verified with syncthing 1.29: start it with
#   syncthing serve --no-browser --gui-address=unix://$HOME/.config/syncthing/gui.sock
# (see examples/syncthing.service.d/gui-socket.conf, a systemd drop-in).  The flag overrides config.xml without
# changing it, and serves plain HTTP on the socket even with tls="true"
# there, which web-ui needs.  Its login and CSRF work through the proxy.
# Keeping TCP instead: --gui-address=http://127.0.0.1:8384 and
# connect = "127.0.0.1:8384".
[services.syncthing]
connect = "unix:~/.config/syncthing/gui.sock"
# command = [...]           # also give a command to have web-ui start it there on first visit

# ---- instances declared per host --------------------------------------------
# The same file can then be copied to every host; each starts its own on
# first visit.  `web-ui up SERVICE DIR` adds more on the fly.
# [instances.<host>.<service>]  <name> = "<dir>"  ->  <name>.<service>.<host>.localhost

[instances.workbox.maggie]
proj = "~/src/proj/.beads"   # the marker dir itself means its parent

[instances.workbox.wckb]
proj = "~/src/proj"

[instances.laptop.wckb]
kb = "~/kb"

# ---- remote hosts this seat reaches -----------------------------------------

[hosts.workbox]
ssh = "workbox.example.org"   # ssh destination; default: the table name
# autotunnel = true           # the proxy opens the tunnel on first request (needs non-interactive ssh auth)
# ensure_remote = true        # run 'web-ui serve --detach' there first; it reports its socket path
web_ui = "~/.local/bin/web-ui"   # ssh runs commands without your login PATH
# remote_runtime_dir = "/run/user/1000"   # only used with ensure_remote = false; default: same uid as here
# ssh_options = ["-o", "GSSAPIAuthentication=yes"]
