# systemd drop-in for the packaged syncthing user unit: its web UI on a Unix
# socket for web-ui (services.syncthing in examples/config.toml).  Install as
#   ~/.config/systemd/user/syncthing.service.d/gui-socket.conf
# then: systemctl --user daemon-reload && systemctl --user enable --now syncthing
#
# The socket goes in syncthing's own config dir, which syncthing keeps at mode
# 0700, so only you can reach it.  syncthing replaces a stale socket left by
# a crash, and removes it when it exits.
#
# --gui-address only overrides config.xml's <gui><address> while it runs:
# tools that read config.xml (syncthing cli) still look at the old address.

[Unit]
ConditionPathExists=%h/.config/syncthing/config.xml

[Service]
# The empty ExecStart= clears the packaged one before replacing it.
ExecStart=
ExecStart=/usr/bin/syncthing serve --no-browser --no-restart --logflags=0 --gui-address=unix://%h/.config/syncthing/gui.sock
